[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "kanto-utils"
version = "1.0.0"
description = "Helper utilities for Causal Inference: A Pokemon Approach"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Brennan Kelley"},
]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "matplotlib>=3.7",
    "seaborn>=0.12",
    "scipy>=1.10",
    "ipywidgets>=8.0",
    "Pillow>=10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "jupyter>=1.0",
    "notebook>=7.0",
]
full = [
    "statsmodels>=0.14",
    "linearmodels>=5.3",
    "econml>=0.15",
    "dowhy>=0.11",
    "causal-learn>=0.1.3",
    "pgmpy>=0.0.21",
    "graphviz>=0.20",
    "plotly>=5.15",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
