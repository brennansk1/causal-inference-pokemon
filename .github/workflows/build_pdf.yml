name: Build PDF

on:
  push:
    branches: [main]
    paths:
      - "textbook/chapters/**"
      - "textbook/build/**"
  pull_request:
    branches: [main]
    paths:
      - "textbook/chapters/**"
      - "textbook/build/**"

jobs:
  build-pdf:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Pandoc
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc

      - name: Install TeX Live
        run: |
          sudo apt-get install -y \
            texlive-xetex \
            texlive-fonts-recommended \
            texlive-fonts-extra \
            texlive-latex-extra \
            texlive-latex-recommended \
            lmodern

      - name: Build PDF
        working-directory: textbook/build
        run: make pdf

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: textbook-pdf
          path: textbook/build/output/causal_inference_pokemon.pdf
          retention-days: 30

      - name: Build HTML
        working-directory: textbook/build
        run: make html

      - name: Upload HTML artifact
        uses: actions/upload-artifact@v4
        with:
          name: textbook-html
          path: textbook/build/output/causal_inference_pokemon.html
          retention-days: 30
