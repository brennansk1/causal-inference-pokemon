name: Validate Notebooks

on:
  push:
    branches: [main, develop]
    paths:
      - "notebooks/**"
      - "src/**"
      - "data/**"
  pull_request:
    branches: [main]
    paths:
      - "notebooks/**"
      - "src/**"
      - "data/**"

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-notebooks-${{ hashFiles('requirements.txt', 'pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-notebooks-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,full]"
          pip install -r requirements.txt
          pip install nbconvert[webpdf] jupyter-client ipykernel

      - name: Install IPython kernel
        run: |
          python -m ipykernel install --user --name causal-pokemon

      - name: Find and validate notebooks
        run: |
          set -e
          FAILED=0
          for nb in $(find notebooks/ -name "*.ipynb" -not -path "*/.ipynb_checkpoints/*" | sort); do
            echo "============================================"
            echo "Validating: $nb"
            echo "============================================"
            if jupyter nbconvert \
                --to notebook \
                --execute \
                --ExecutePreprocessor.timeout=600 \
                --ExecutePreprocessor.kernel_name=causal-pokemon \
                --output /dev/null \
                "$nb"; then
              echo "  PASSED: $nb"
            else
              echo "  FAILED: $nb"
              FAILED=$((FAILED + 1))
            fi
          done

          if [ "$FAILED" -gt 0 ]; then
            echo ""
            echo "============================================"
            echo "ERROR: $FAILED notebook(s) failed validation"
            echo "============================================"
            exit 1
          fi

          echo ""
          echo "All notebooks validated successfully."
